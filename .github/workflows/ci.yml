name: DigiSangam CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: find app public scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHP smoke tests
        run: php tests/smoke.php

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile intelligence/engine.py intelligence/app.py
      - name: Intelligence engine tests
        run: PYTHONPATH=intelligence python -m unittest discover -s intelligence/tests -p 'test_*.py'

  release:
    runs-on: ubuntu-latest
    needs: [frontend, php, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Build production frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Build DigiOps release payload
        run: php tools/package-release.php
      - name: Verify DigiOps release payload
        run: php tools/check-release-package.php
      - name: Upload DigiOps release artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
