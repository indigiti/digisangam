name: DigiSangam CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: find app public scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHP smoke tests
        run: php tests/smoke.php
      - name: HTTP API E2E
        run: |
          export DIGISANGAM_STORAGE_ROOT="$RUNNER_TEMP/digisangam-e2e-storage"
          rm -rf "$DIGISANGAM_STORAGE_ROOT"
          php -S 127.0.0.1:8099 tests/router.php > "$RUNNER_TEMP/digisangam-e2e-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8099/api/v1/auth/status >/dev/null; then break; fi
            sleep 0.2
          done
          php tests/api_e2e.php || { cat "$RUNNER_TEMP/digisangam-e2e-server.log"; exit 1; }

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m py_compile intelligence/engine.py intelligence/app.py
      - name: Intelligence engine tests
        run: PYTHONPATH=intelligence python -m unittest discover -s intelligence/tests -p 'test_*.py'

  release:
    runs-on: ubuntu-latest
    needs: [frontend, php, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Build production frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Build DigiOps release payload
        run: php tools/package-release.php
      - name: Verify DigiOps release payload
        run: php tools/check-release-package.php
      - name: Upload DigiOps release artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
